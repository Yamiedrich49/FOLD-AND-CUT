function parseCuts(){let s=q().cutPath;cutPieces=s.match(/M[^M]+/g)||[s];cutPieces=cutPieces.map(x=>x.trim());cutCentroids=[];cutLines=[];const judge=document.createElementNS('http://www.w3.org/2000/svg','path');judge.setAttribute('d',q().stages[q().folds.length]);svg.appendChild(judge);
 for(let d of cutPieces){let pts=[...d.matchAll(/[ML]\s*(-?[\d.]+),\s*(-?[\d.]+)/g)].map(m=>({x:+m[1],y:+m[2]}));if(pts.length>1&&distance(pts[0],pts.at(-1))<1)pts.pop();let center={x:pts.reduce((v,p)=>v+p.x,0)/pts.length,y:pts.reduce((v,p)=>v+p.y,0)/pts.length};cutCentroids.push(center);
 let edges=[];for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},len=distance(a,b);if(len<2)continue;let test=svg.createSVGPoint();test.x=mid.x;test.y=mid.y;edges.push({a,b,len,inside:judge.isPointInFill(test)});}
 let interior=edges.filter(e=>e.inside);let chosen=interior.length?interior:edges;chosen.sort((a,b)=>b.len-a.len);
 // A V-shaped cut uses its two internal sides; the preview traces the same real cutting edges.
 let segs=chosen.slice(0,interior.length===2?2:1);let dLine=segs.map((e,i)=>`M${e.a.x},${e.a.y} L${e.b.x},${e.b.y}`).join(' ');cutLines.push(dLine);
 }
 judge.remove();cutIdx=0;cutMaskPaths=[];
}
function enterCut(){animationToken++;setPhase('cut');hold=false;foldOverlay.style.display='none';cutOverlay.style.display='';guideVisibility(false);paperStatic(q().stages[q().folds.length]);setCamera(q().camera[q().camera.length-1]);maskHoles.setAttribute('d','');parseCuts();showCutGuide();}
function showCutGuide(){if(cutIdx>=cutPieces.length){enterChoice();return}let piece=cutPieces[cutIdx];$('cutregion').setAttribute('d',piece);$('cutline').setAttribute('d',cutLines[cutIdx]);$('scratch').setAttribute('d','');refreshUI();}
function chooseView(d){return `<svg viewBox="-9 -9 338 338" preserveAspectRatio="xMidYMid meet"><path d="${d}" fill="#fffdf7" stroke="#91acb2" stroke-width="3.5" stroke-linejoin="round"/></svg>`}
function renderOptions(){let n=q().choices.length;const container=$('options');container.className='options '+(n===4?'four':n===6?'six':'eight');container.innerHTML=q().choices.map((d,i)=>`<button class="option" data-i="${i}" aria-label="選択肢${letters[i]}"><span class="letter">${letters[i]}</span>${chooseView(d)}</button>`).join('');
 container.querySelectorAll('button').forEach((btn,i)=>{let timer,startX=0,startY=0;btn.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;timer=setTimeout(()=>{if(phase==='choice'){$('preview').innerHTML=chooseView(q().choices[i]);$('preview').classList.add('show')}},410)});btn.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>12)clearTimeout(timer)});['pointerup','pointercancel','pointerleave'].forEach(evt=>btn.addEventListener(evt,()=>{clearTimeout(timer);$('preview').classList.remove('show')}));btn.addEventListener('click',()=>select(i))});}
function select(i){if(phase!=='choice')return;selected=i;document.querySelectorAll('.option').forEach((btn,j)=>btn.classList.toggle('selected',i===j));sfx('choose');refreshUI()}
function enterChoice(){cutOverlay.style.display='none';foldOverlay.style.display='none';paperStatic(q().foldedCut);setCamera(q().camera.at(-1));maskHoles.setAttribute('d','');setPhase('choice');renderOptions();}
function cutWithSwipe(){let piece=cutPieces[cutIdx];cutMaskPaths.push(piece);maskHoles.setAttribute('d',cutMaskPaths.join(' '));$('scratch').setAttribute('d','');$('cutregion').setAttribute('d','');$('cutline').setAttribute('d','');sfx('cut');hold=true;setTimeout(()=>{if(phase!=='cut')return;cutIdx++;hold=false;showCutGuide()},reduced?40:190)}
async function unfold(){if(selected<0||hold||phase!=='choice')return;setPhase('unfold');hold=true;foldOverlay.style.display='none';cutOverlay.style.display='none';maskHoles.setAttribute('d','');let token=++animationToken;paperStatic(q().foldedCut);setCamera(q().camera.at(-1));
 await new Promise(r=>setTimeout(r,reduced?35:230));if(token!==animationToken)return;
 for(let k=0;k<q().unfoldMovie.length;k++){if(token!==animationToken)return;let frames=q().unfoldMovie[k],fromCam=q().camera[q().folds.length-k],toCam=q().camera[q().folds.length-k-1];$('phaseLabel').textContent=`UNFOLD  ·  ${k+1} / ${q().unfoldMovie.length}`;sfx('open');let ok=await animateUnfold(k,frames,fromCam,toCam,token);if(!ok)return;await new Promise(r=>setTimeout(r,reduced?35:125));}
 if(token!==animationToken)return;paperStatic(q().final);setCamera(q().camera[0]);hold=false;showResult();}
function animateUnfold(k,frames,a,b,token){return new Promise(resolve=>{let start=performance.now();const time=reduced?100:650;function tick(now){if(token!==animationToken)return resolve(false);let t=clamp((now-start)/time),x=Math.min(frames.length-1,Math.floor(t*(frames.length-1))),item=frames[x];setPaths(item[0],item[1]);interpolateCam(a,b,t);if(t<1)requestAnimationFrame(tick);else resolve(true)}requestAnimationFrame(tick)})}
function showResult(){setPhase('result');let right=selected===q().correct;$('resultTitle').textContent=right?'ぴったり、正解！':`正解は ${letters[q().correct]}`;$('resultBody').textContent=right?'紙が開いて、模様がつながった。':`あなたの予想：${letters[selected]} ／ 正解：${letters[q().correct]}`;$('resultChip').innerHTML=chooseView(q().choices[q().correct]);if(right)sfx('win');if(!right){let d=q().comparison[selected];$('diffOver').setAttribute('d',d.extra||'');$('diffUnder').setAttribute('d',d.missing||'');}else{$('diffOver').setAttribute('d','');$('diffUnder').setAttribute('d','');}}
function restart(n=idx){animationToken++;hold=false;gesture=null;idx=n;foldIdx=0;cutIdx=0;selected=-1;cutPieces=[];cutMaskPaths=[];maskHoles.setAttribute('d','');$('diffOver').setAttribute('d','');$('diffUnder').setAttribute('d','');$('level').textContent=`LEVEL ${String(idx+1).padStart(2,'0')} · ${q().difficulty}`;$('title').textContent=q().title;$('count').textContent=`${String(idx+1).padStart(2,'0')} / ${String(PUZZLES.length).padStart(2,'0')}`;$('bar').innerHTML=PUZZLES.map((_,i)=>`<span class="${i===idx?'on':i<idx?'done':''}"></span>`).join('');foldOverlay.style.display='';cutOverlay.style.display='none';guideVisibility(true);$('preview').classList.remove('show');setPhase('fold');showCurrentFold()}
function gestureStart(e){if(hold||!['fold','cut'].includes(phase))return;const root=rootCoords(e),p=camCoords(root),k=foldIdx;if(phase==='fold'){
 let f=q().folds[k],start={x:f.arrow[0][0]*320,y:f.arrow[0][1]*320};let near=distance(p,start)<112;const fpath=flap;let pt=svg.createSVGPoint();pt.x=p.x;pt.y=p.y;let onFlap=false;try{onFlap=fpath.isPointInFill(pt)}catch(e){}
 if(!near&&!onFlap)return;
 gesture={kind:'fold',id:e.pointerId,start:root,fold:k,p:0,initial:p};guideVisibility(false);
 }else{const center=cutCentroids[cutIdx];if(!center||distance(p,center)>110)return;gesture={kind:'cut',id:e.pointerId,start:root,last:root,total:0,points:[p],progress:0};}
 zone.classList.add('dragging');try{zone.setPointerCapture(e.pointerId)}catch(e){}e.preventDefault();soundUnlock();}
function gestureMove(e){if(!gesture||gesture.id!==e.pointerId||hold)return;let root=rootCoords(e);if(gesture.kind==='fold'){
 const f=q().folds[gesture.fold],a=sc(f.arrow[0],gesture.fold),b=sc(f.arrow[1],gesture.fold),u={x:b.x-a.x,y:b.y-a.y},v={x:root.x-gesture.start.x,y:root.y-gesture.start.y};let dot=v.x*u.x+v.y*u.y;let p=clamp(dot/Math.max(40,u.x*u.x+u.y*u.y));gesture.p=p;showFold(gesture.fold,p);
 }else{let point=camCoords(root);gesture.total+=distance(gesture.last,root);gesture.last=root;gesture.points.push(point);if(gesture.points.length>70)gesture.points.shift();$('scratch').setAttribute('d',gesture.points.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '));}
 e.preventDefault();}
function gestureEnd(e){if(!gesture||gesture.id!==e.pointerId)return;let g=gesture;gesture=null;zone.classList.remove('dragging');if(g.kind==='fold'){
 if(g.p>=.48)finishFold(g.p);else rewindFold(g.p);
 }else{if(g.total>23){cutWithSwipe()}else{$('scratch').setAttribute('d','');}}
 e.preventDefault();}
zone.addEventListener('pointerdown',gestureStart);zone.addEventListener('pointermove',gestureMove);zone.addEventListener('pointerup',gestureEnd);zone.addEventListener('pointercancel',e=>{if(gesture)gestureEnd(e)});
$('undo').addEventListener('click',()=>{if(hold||phase==='unfold')return;if(phase==='choice'){restart(idx);return;}if(phase==='fold'&&foldIdx>0){animationToken++;foldIdx--;hold=false;guideVisibility(true);showCurrentFold();sfx('choose');}else if(phase==='cut'){if(cutIdx>0){cutIdx--;cutMaskPaths.pop();maskHoles.setAttribute('d',cutMaskPaths.join(' '));showCutGuide();}else{animationToken++;foldIdx=q().folds.length-1;cutOverlay.style.display='none';foldOverlay.style.display='';setPhase('fold');showCurrentFold();}}});
$('mainbtn').addEventListener('click',()=>{soundUnlock();if(phase==='choice')unfold();else if(phase==='result')restart((idx+1)%PUZZLES.length)});
$('sound').addEventListener('click',()=>{muted=!muted;$('soundWave').style.display=muted?'none':'';if(!muted)soundUnlock();});
window.addEventListener('keydown',e=>{if(phase==='choice'&&/^[a-h]$/i.test(e.key)){let n=letters.indexOf(e.key.toUpperCase());if(n<q().choices.length)select(n)}if(e.key==='Enter'&&phase==='choice'&&selected>=0)unfold();if(e.key==='Escape'&&phase==='result')restart(idx)});
restart(0);
</script></body></html>
