const $=(id)=>document.getElementById(id);
let idx=0,phase='fold',step=0,selection=null,score=0,answered=[],animationId=null,autoId=null,replaying=false;
const paper=$('paper'),crease=$('crease'),redcut=$('redcut'),arrow=$('arrow');
const levels=['入門','初級','中級','上級','難問'];
const labels='ABCDEFGH';
function svgPaper(d){return `<svg viewBox="-10 -10 340 340" aria-hidden="true"><rect x="0" y="0" width="320" height="320" fill="#eef3f2"/><path d="${d}" fill="#fffdfa" fill-rule="evenodd" stroke="#4f6872" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function clearTimers(){if(animationId!==null){clearInterval(animationId);animationId=null}if(autoId!==null){clearTimeout(autoId);autoId=null}}
function showGuide(f){let pp=f.p,qq=f.q,aa=f.arrow;crease.setAttribute('d',`M${pp[0]*320} ${pp[1]*320}L${qq[0]*320} ${qq[1]*320}`);crease.style.display='block';arrow.setAttribute('d',`M${aa[0][0]*320} ${aa[0][1]*320} L${aa[1][0]*320} ${aa[1][1]*320}`);arrow.style.display='block'}
function updateStage(){const q=PUZZLES[idx],n=q.folds.length;
  paper.setAttribute('d',step===n?q.foldedCut:q.stages[step]);
  redcut.style.display=step===n?'block':'none';redcut.setAttribute('d',q.cutPath);
  if(step===n){crease.style.display='none';arrow.style.display='none';$('stageLabel').textContent='✂ '+q.cut_label}
  else{showGuide(q.folds[step]);$('stageLabel').textContent=step===0?'正方形の紙からスタート':q.folds[step-1].label}
  $('stepNumber').textContent=`${step} / ${n} 回折り`;
  $('ministeps').innerHTML=q.folds.map((f,i)=>`<span class="mini-step ${i<step?'done':i===step?'now':''}">${i+1}. ${f.label}</span>`).join('');
  $('backstep').disabled=step===0;
  $('nextstep').disabled=step>=n;
  $('nextstep').textContent=step>=n?'切り終わり':`折る ${step+1}/${n} ▶`;
  $('helper').textContent=step===n?'この状態で、赤い切り取り線の部分をパチンと切ります。':'水色の点線が次の折り目。矢印の向きへ折ります。';
}
function renderChoices(){const q=PUZZLES[idx];$('choices').innerHTML=q.choices.map((d,i)=>{
 let state=phase==='result'?(i===q.correct?'correct':i===selection?'wrong':''):i===selection?'selected':'';
 return `<button class="choice ${state}" ${phase==='unfold'||phase==='result'?'disabled':''} data-i="${i}" aria-label="選択肢${labels[i]}">${svgPaper(d)}<span class="letter">${labels[i]}</span><span class="state">${i===q.correct?'正解':'選択'}</span></button>`
 }).join('');
 $('choices').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(phase==='result'||phase==='unfold')return;selection=Number(b.dataset.i);renderChoices();updateAction()}));
}
function updateAction(){const q=PUZZLES[idx];const btn=$('action');
 if(phase==='result'){btn.disabled=false;btn.textContent=idx<PUZZLES.length-1?'次の問題へ →':'5問の結果を見る ▶';return}
 if(phase==='unfold'){btn.disabled=true;btn.textContent='紙を開いています…';return}
 btn.disabled=selection===null;btn.textContent=selection===null?'模様を選択してください':`「${labels[selection]}」で答え合わせする`;
}
function start(qi){clearTimers();idx=qi;step=0;phase='fold';selection=null;let q=PUZZLES[idx];
 $('progress').innerHTML=PUZZLES.map((p,i)=>`<span class="dot ${i===idx?'current':i<idx?'complete':''}"></span>`).join('');
 $('level').textContent=`LEVEL ${idx+1} • ${q.difficulty}`;
 $('questionTitle').textContent=q.title;$('problemCount').textContent=`${String(idx+1).padStart(2,'0')} / 05`;
 $('choiceCount').textContent=`${q.choices.length}択`;
 $('result').classList.remove('open');$('theEnd').style.display='none';
 $('stepControls').style.display='flex';$('ministeps').style.display='flex';
 updateStage();renderChoices();updateAction();
}
function moveStep(d){if(phase==='unfold'||phase==='result')return;step=Math.max(0,Math.min(PUZZLES[idx].folds.length,step+d));updateStage()}
function reveal(isReplay=false){if(selection===null||phase==='unfold'||(phase==='result'&&!isReplay))return;replaying=isReplay;let q=PUZZLES[idx];phase='unfold';clearTimers();step=q.folds.length;updateStage();if(isReplay)document.querySelector('.sheet').scrollIntoView({block:'start',behavior:'smooth'});
 $('stepControls').style.display='none';$('ministeps').style.display='none';$('result').classList.remove('open');redcut.style.display='none';crease.style.display='none';arrow.style.display='none';
 renderChoices();updateAction();
 let i=0,frames=q.unfold;
 $('stageLabel').textContent='紙を1回ずつ開いています…';
 animationId=setInterval(()=>{
   if(i>=frames.length){clearTimers();finish();return}
   const f=frames[i++];paper.setAttribute('d',f.d);
   $('stepNumber').textContent=`展開中 ${q.folds.length-f.step+1} / ${q.folds.length}`;
   $('stageLabel').textContent=`${f.step}回目の折り目を開いています`;
 },65);
}
function finish(){const q=PUZZLES[idx];phase='result';paper.setAttribute('d',q.final);$('stageLabel').textContent='元の紙に戻りました';$('stepNumber').textContent='展開完了';
 const yes=selection===q.correct;if(!replaying){answered[idx]=yes;if(yes)score++;}
 $('resultTitle').textContent=yes?'✓ 正解！':'正解は「'+labels[q.correct]+'」';
 $('resultDetail').textContent=q.explanation;
 $('result').classList.add('open');$('helper').textContent='完成した切り紙の模様です。展開の動きは何度でも見直せます。';
 renderChoices();updateAction();
 $('result').scrollIntoView({block:'nearest',behavior:'smooth'});
}
$('replay').addEventListener('click',()=>reveal(true));
$('backstep').addEventListener('click',()=>moveStep(-1));$('nextstep').addEventListener('click',()=>moveStep(1));
$('action').addEventListener('click',()=>{
 if(phase==='result'){if(idx<PUZZLES.length-1){start(idx+1);window.scrollTo({top:0,behavior:'smooth'})}
 else{showEnd()} }else{reveal()}
});
function showEnd(){const q=PUZZLES[idx];$('theEnd').style.display='block';$('enddetail').textContent=`${PUZZLES.length}問中 ${score}問正解。どの折り方が面白いか、ぜひ教えてください。`; $('theEnd').scrollIntoView({behavior:'smooth'})}
$('restart').addEventListener('click',()=>{score=0;answered=[];start(0);window.scrollTo({top:0,behavior:'smooth'})});
start(0);
</script>
