  if(audio.state==='suspended')audio.resume().catch(()=>{});
  if(!noiseBuffer){const n=Math.round(audio.sampleRate*.65);noiseBuffer=audio.createBuffer(1,n,audio.sampleRate);const v=noiseBuffer.getChannelData(0);for(let i=0;i<n;i++)v[i]=(Math.random()*2-1)*.8;}
  return audio;
 }catch(e){return null}
}
function noise(start,duration,volume,freq,highpass=false){
 const a=audioReady();if(!a)return;
 const src=a.createBufferSource();src.buffer=noiseBuffer;
 const filter=a.createBiquadFilter();filter.type=highpass?'highpass':'bandpass';filter.frequency.value=freq;filter.Q.value=highpass?.5:.72;
 const gain=a.createGain();const t=a.currentTime+start;const peak=Math.max(.0002,volume);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(peak,t+Math.min(.035,duration*.3));gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 src.connect(filter).connect(gain).connect(a.destination);src.start(t);src.stop(t+duration+.01);
}
function pluck(start,freq,volume,duration){
 const a=audioReady();if(!a)return;
 const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+start;
 o.type='sine';o.frequency.setValueAtTime(freq*(.99+Math.random()*.025),t);o.frequency.exponentialRampToValueAtTime(freq*.86,t+duration);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+duration+.01);
}
function sfx(type){
 if(!soundOn||!audioUnlocked)return;
 if(type==='tick'){noise(0,.036,.055,2100,true);pluck(.008,490,.018,.07)}
 else if(type==='fold'){noise(0,.21,.034,1200);noise(.10,.055,.02,2000,true);pluck(.17,220,.008,.085)}
 else if(type==='snip'){noise(0,.082,.085,2600,true);pluck(0,830,.029,.055);noise(.07,.052,.045,3600,true);pluck(.085,615,.018,.065)}
 else if(type==='open'){noise(0,.42,.027,720);noise(.24,.33,.021,1340)}
 else if(type==='finish'){pluck(0,523.25,.019,.38);pluck(.07,783.99,.013,.52);noise(.01,.10,.014,2000,true)}
}
$('sound').classList.add('on');$('soundwave').style.display='';$('soundoff').style.display='none';$('sound').setAttribute('aria-label','音をオフにする');
document.addEventListener('pointerdown',()=>{audioUnlocked=true;if(soundOn)audioReady()},{once:true,passive:true});document.addEventListener('keydown',()=>{audioUnlocked=true;if(soundOn)audioReady()},{once:true});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').classList.toggle('on',soundOn);$('soundwave').style.display=soundOn?'':'none';$('soundoff').style.display=soundOn?'none':'';$('sound').setAttribute('aria-label',soundOn?'音をオフにする':'音をオンにする');if(soundOn)sfx('tick')});
$('action').addEventListener('click',()=>{if(phase==='ready')unfold();else if(phase==='result'){if(index===PUZZLES.length-1){score=0;answered=[];start(0)}else start(index+1)}});
$('replay').addEventListener('click',()=>{if(phase==='unfold')return;if(phase==='fold')skipFold();else if(phase==='result')unfold(true);else fold(0)});
$('paperHit').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(phase==='result')unfold(true);else if(phase!=='unfold')fold(0)}});
const area=$('paperHit');
area.addEventListener('pointerdown',e=>{if(phase==='unfold')return;dragging=true;dragMoved=false;downX=e.clientX;downY=e.clientY;lastPointer=e.clientX;dragStartFrame=currentFoldFrame;try{area.setPointerCapture(e.pointerId)}catch(err){} });
area.addEventListener('pointermove',e=>{if(!dragging||phase==='unfold')return;const dx=e.clientX-downX;if(phase==='result'){if(Math.abs(dx)>9)dragMoved=true;if(dragMoved&&dx<0){clearDifference();const r=Math.max(0,Math.min(1,-dx/area.getBoundingClientRect().width));const pos=unfoldFlat[Math.round((1-r)*(unfoldFlat.length-1))];if(pos)displayUnfold(pos.group,pos.frame);setStatus('紙に触れてみよう','左右に動かして折り目をたどる')}return;}  if(Math.abs(dx)>9)dragMoved=true;if(!dragMoved)return;run++;if(phase!=='fold')setPhase('fold');const rect=area.getBoundingClientRect();const target=Math.max(0,Math.min(foldFlat.length-1,Math.round(dragStartFrame+(dx/rect.width)*(foldFlat.length-1))));const p=foldFlat[target];displayFold(p.group,p.frame);CUT.style.display='none';setStatus('指で折り方を確認',`${p.group+1} / ${PUZZLES[index].folds.length} 回目の折り目`);lastPointer=e.clientX});
function endDrag(){if(!dragging)return;dragging=false;if(phase==='result'){unfold(true);return}if(phase==='unfold')return;if(dragMoved){const resume=currentFoldFrame;const t=run;setTimeout(()=>{if(t===run)fold(resume)},220)}else if(phase==='fold')skipFold();else fold(0)}
area.addEventListener('pointerup',endDrag);area.addEventListener('pointercancel',()=>{dragging=false;if(phase==='fold')fold(currentFoldFrame)});
window.addEventListener('keydown',e=>{if(phase==='ready'&&/^[a-h]$/i.test(e.key)){let i=LETTERS.indexOf(e.key.toUpperCase());if(i<PUZZLES[index].choices.length)pick(i)}if(e.key==='Enter'&&phase==='ready'&&selection>=0)unfold()});
start(0);
