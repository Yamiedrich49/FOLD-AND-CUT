// Center the grip and direction guide on the visible moving flap, not on

function centeredFlapGuide(f){

 container.querySelectorAll('button').forEach((btn,i)=>{let timer,startX=0,startY=0;btn.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;timer=setTimeout(()=>{if(phase==='choice'){$('preview').innerHTML=chooseView(q().choices[i]);$('preview').classList.add('show')}},410)});btn.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-startX,e.clientY-startY)>12)clearTimeout(timer)});['pointerup','pointercancel','pointerleave'].forEach(evt=>btn.addEventListener(evt,()=>{clearTimeout(timer);$('preview').classList.remove('show')}));btn.addEventListener('click',()=>select(i))});}
function select(i){if(phase!=='choice')return;selected=i;document.querySelectorAll('.option').forEach((btn,j)=>btn.classList.toggle('selected',i===j));sfx('choose');refreshUI()}
function enterChoice(){cutOverlay.style.display='none';foldOverlay.style.display='none';paperStatic(q().foldedCut);setCamera(q().camera.at(-1));maskHoles.setAttribute('d','');setPhase('choice');renderOptions();}
function cutWithTap(){let piece=cutPieces[cutIdx];cutMaskPaths.push(piece);maskHoles.setAttribute('d',cutMaskPaths.join(' '));$('scratch').setAttribute('d','');$('cutregion').setAttribute('d','');$('cutline').setAttribute('d','');sfx('cut');hold=true;setTimeout(()=>{if(phase!=='cut')return;cutIdx++;hold=false;showCutGuide()},reduced?40:125)}
async function unfold(){if(selected<0||hold||phase!=='choice')return;setPhase('unfold');hold=true;foldOverlay.style.display='none';cutOverlay.style.display='none';maskHoles.setAttribute('d','');let token=++animationToken;paperStatic(q().foldedCut);setCamera(q().camera.at(-1));
 await new Promise(r=>setTimeout(r,reduced?35:85));if(token!==animationToken)return;
 for(let k=0;k<q().unfoldMovie.length;k++){if(token!==animationToken)return;let frames=q().unfoldMovie[k],fromCam=q().camera[q().folds.length-k],toCam=q().camera[q().folds.length-k-1];$('phaseLabel').textContent=`UNFOLD  ·  ${k+1} / ${q().unfoldMovie.length}`;sfx('open');let ok=await animateUnfold(k,frames,fromCam,toCam,token);if(!ok)return;await new Promise(r=>setTimeout(r,reduced?30:55));}
 if(token!==animationToken)return;paperStatic(q().final);setCamera(q().camera[0]);hold=false;showResult();}
function animateUnfold(k,frames,a,b,token){return new Promise(resolve=>{
 let start=performance.now(),time=reduced?100:320;
 function tick(now){
  if(token!==animationToken)return resolve(false);
  let t=clamp((now-start)/time);
  // The sheet moves decisively and settles quickly instead of drifting through a long easing curve.
  let crisp=t<.76?t*(.94/.76):.94+(t-.76)*(.06/.24);
  let x=Math.min(frames.length-1,Math.floor(crisp*(frames.length-1))),item=frames[x];
  setPaths(item[0],item[1]);interpolateCam(a,b,t);
  if(t<1)requestAnimationFrame(tick);else resolve(true);
 }
 requestAnimationFrame(tick)
})}
function showResult(){
 saveMasterResult();
 const right=selected===q().correct;
 setPhase('result');
 $('resultTitle').textContent=right?'ぴったり、正解！':'おしい！ 見比べてみよう';
 $('resultBody').textContent=right?'紙を広げると、こんな模様になるよ。':'左が予想、右が正解。どこが違うかな？';
 const panel=$('resultpanel');panel.classList.toggle('correct-only',right);
 const card=(label,path,kind)=>`<div class="result-view ${kind}"><span>${label}</span>${chooseView(path)}</div>`;
 $('resultComparison').innerHTML=right
  ?card('できあがり',q().choices[q().correct],'correct')
  :card('選んだ ${letters[selected]}',q().choices[selected],'guess')+card('正解 ${letters[q().correct]}',q().choices[q().correct],'correct');
 $('retrybtn').hidden=right;
 $('mainbtn').textContent=right?(idx===PUZZLES.length-1?'最初からもう一度':'次の問題へ  →'):'次の問題へ  →';
 $('diffOver').setAttribute('d','');$('diffUnder').setAttribute('d','');
 if(right)sfx('win');
}

// Master 500 — local, offline progress; the user can revisit any level.
let masterSave={completed:{},last:0};
const PROGRESS_KEY='foldcut_master500_v8';
try{
 const current=localStorage.getItem(PROGRESS_KEY);
 if(current){
  const data=JSON.parse(current);
  if(data&&typeof data==='object')masterSave={completed:data.completed||{},last:data.last||0};
 }else{
  const old=localStorage.getItem('foldcut_master500_v7')||localStorage.getItem('foldcut_master500_v6');
  if(old){
   const data=JSON.parse(old);
   if(data&&typeof data==='object'){
    const migrated={};
    for(const [n,v] of Object.entries(data.completed||{})){
     const index=LEGACY_TO_PROGRESS[Number(n)-1];
     if(Number.isInteger(index))migrated[String(index+1)]=v;
    }
    const former=Math.min(499,Math.max(0,Number(data.last)||0));
    masterSave={completed:migrated,last:LEGACY_TO_PROGRESS[former]??0};
    localStorage.setItem(PROGRESS_KEY,JSON.stringify(masterSave));
   }
  }
 }
}catch(e){}
function saveMasterResult(){
 try{const k=String(idx+1),prev=masterSave.completed[k]||{attempts:0,perfect:false};
  masterSave.completed[k]={attempts:prev.attempts+1,passed:prev.passed||(selected===q().correct),perfect:prev.perfect||(selected===q().correct&&!hintVisible)};
  masterSave.last=Math.max(masterSave.last,idx+1);localStorage.setItem(PROGRESS_KEY,JSON.stringify(masterSave));}
 catch(e){}
}
function openChapterPicker(){
 const overlay=document.getElementById('chaptersOverlay');
 overlay.innerHTML=`<div class="chapters-card" role="dialog" aria-modal="true" aria-label="章とレベルを選ぶ"><div class="chapters-title"><div><span>YOUR JOURNEY</span><h2>500問の修行</h2><small>${Object.values(masterSave.completed||{}).filter(v=>v.passed).length} / 500 問を正解済み</small></div><button class="close-picker" aria-label="閉じる">×</button></div><div class="chapters-scroll">${CHAPTERS.map((c,i)=>`<section class="chapter-choice"><div class="chapter-label"><span>CHAPTER ${String(i+1).padStart(2,'0')}</span><strong>${c.name}</strong></div><p>${c.about}</p><div class="chapter-dots">${Array.from({length:25},(_,j)=>{let n=i*25+j+1,s=masterSave.completed[String(n)];return `<button class="chapter-level ${n===idx+1?'current':''} ${s?.passed?'done':s?'tried':''}" data-n="${n}" title="LEVEL ${n}" aria-label="レベル ${n}">${j+1}</button>`}).join('')}</div></section>`).join('')}</div></div>`;
 overlay.classList.add('visible');document.body.classList.add('picker-open');
 overlay.querySelector('.close-picker').addEventListener('click',closeChapterPicker);
 overlay.querySelectorAll('[data-n]').forEach(btn=>btn.addEventListener('click',()=>{const num=+btn.dataset.n;closeChapterPicker();restart(num-1)}));
 overlay.onclick=e=>{if(e.target===overlay)closeChapterPicker();};
 const active=overlay.querySelectorAll('.chapter-choice')[Math.floor(idx/25)];
 if(active)active.scrollIntoView({block:'nearest'});
}
function closeChapterPicker(){document.getElementById('chaptersOverlay').classList.remove('visible');document.body.classList.remove('picker-open')}

function restart(n=idx){animationToken++;hold=false;gesture=null;idx=n;foldIdx=0;cutIdx=0;selected=-1;hintVisible=false;$('retrybtn').hidden=true;cutPieces=[];cutMaskPaths=[];maskHoles.setAttribute('d','');$('diffOver').setAttribute('d','');$('diffUnder').setAttribute('d','');$('level').textContent=`CH ${String(q().chapter+1).padStart(2,'0')} · LEVEL ${String(idx+1).padStart(3,'0')} · ${q().difficulty}`;$('title').textContent=q().title;$('count').textContent=`${String(idx+1).padStart(3,'0')} / ${String(PUZZLES.length)}`;$('bar').innerHTML=Array.from({length:25},(_,i)=>`<span class="${i===idx%25?'on':i<idx%25?'done':''}"></span>`).join('');foldOverlay.style.display='';cutOverlay.style.display='none';guideVisibility(true);$('preview').classList.remove('show');setPhase('fold');showCurrentFold()}
function gestureStart(e){if(hold||!['fold','cut'].includes(phase))return;const root=rootCoords(e),p=camCoords(root),k=foldIdx;if(phase==='fold'){
 let f=q().folds[k],start=foldGuideStart||{x:f.arrow[0][0]*320,y:f.arrow[0][1]*320};let near=distance(p,start)<112;const fpath=flap;let pt=svg.createSVGPoint();pt.x=p.x;pt.y=p.y;let onFlap=false;try{onFlap=fpath.isPointInFill(pt)}catch(e){}
 if(!near&&!onFlap)return;
 gesture={kind:'fold',id:e.pointerId,start:root,fold:k,p:0,initial:p};guideVisibility(false);
 }else{const segs=cutHitSegments[cutIdx]||[];const near=segs.some(s=>pointSegmentDistance(p,s.a,s.b)<38);const pt=svg.createSVGPoint();pt.x=p.x;pt.y=p.y;let onRegion=false;try{onRegion=$('cutregion').isPointInFill(pt)}catch(e){}if(!near&&!onRegion)return;gesture={kind:'cut',id:e.pointerId,start:root,moved:false};}
 zone.classList.add('dragging');try{zone.setPointerCapture(e.pointerId)}catch(e){}e.preventDefault();soundUnlock();}
function gestureMove(e){if(!gesture||gesture.id!==e.pointerId||hold)return;let root=rootCoords(e);if(gesture.kind==='fold'){
 const f=q().folds[gesture.fold],a=sc(f.arrow[0],gesture.fold),b=sc(f.arrow[1],gesture.fold),u={x:b.x-a.x,y:b.y-a.y},v={x:root.x-gesture.start.x,y:root.y-gesture.start.y};let dot=v.x*u.x+v.y*u.y;let p=clamp(dot/Math.max(40,u.x*u.x+u.y*u.y));gesture.p=p;showFold(gesture.fold,p);
 }else if(distance(root,gesture.start)>18){gesture.moved=true;}
 e.preventDefault();}
function gestureEnd(e){if(!gesture||gesture.id!==e.pointerId)return;let g=gesture;gesture=null;zone.classList.remove('dragging');if(g.kind==='fold'){
 if(g.p>=.48)finishFold(g.p);else rewindFold(g.p);
 }else{if(!g.moved&&distance(rootCoords(e),g.start)<18)cutWithTap();}
 e.preventDefault();}
zone.addEventListener('pointerdown',gestureStart);zone.addEventListener('pointermove',gestureMove);zone.addEventListener('pointerup',gestureEnd);zone.addEventListener('pointercancel',()=>{const g=gesture;gesture=null;zone.classList.remove('dragging');if(g?.kind==='fold'&&!hold)rewindFold(g.p)});
$('undo').addEventListener('click',()=>{if(hold||phase==='unfold')return;if(phase==='choice'){restart(idx);return;}if(phase==='fold'&&foldIdx>0){animationToken++;foldIdx--;hold=false;guideVisibility(true);showCurrentFold();sfx('choose');}else if(phase==='cut'){if(cutIdx>0){cutIdx--;cutMaskPaths.pop();maskHoles.setAttribute('d',cutMaskPaths.join(' '));showCutGuide();}else{animationToken++;foldIdx=q().folds.length-1;cutOverlay.style.display='none';foldOverlay.style.display='';setPhase('fold');showCurrentFold();}}});
$('count').addEventListener('click',openChapterPicker);
$('retrybtn').addEventListener('click',()=>{soundUnlock();if(phase==='result')restart(idx)});
$('mainbtn').addEventListener('click',()=>{soundUnlock();if(phase==='choice')unfold();else if(phase==='result')restart((idx+1)%PUZZLES.length)});
$('sound').addEventListener('click',()=>{muted=!muted;$('soundWave').style.display=muted?'none':'';if(!muted)soundUnlock();});
window.addEventListener('keydown',e=>{if(phase==='choice'&&/^[a-h]$/i.test(e.key)){let n=letters.indexOf(e.key.toUpperCase());if(n<q().choices.length)select(n)}if(e.key==='Enter'&&phase==='choice'&&selected>=0)unfold();if(e.key==='Escape'&&phase==='result')restart(idx)});
restart(Math.min(499,Math.max(0,masterSave.last)));
</script><div id="chaptersOverlay"></div></body></html>
